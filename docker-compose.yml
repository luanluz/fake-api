services:
  fake-api:
    build: .
    container_name: fake-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_NAME: ${APP_NAME:-Fake API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      HOST: 0.0.0.0
      PORT: 3000
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-fake-api-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SEED_PASSWORD: ${SEED_PASSWORD:-password123}
      PAGINATION_DEFAULT_PAGE: ${PAGINATION_DEFAULT_PAGE:-1}
      PAGINATION_DEFAULT_LIMIT: ${PAGINATION_DEFAULT_LIMIT:-10}
      PAGINATION_MAX_LIMIT: ${PAGINATION_MAX_LIMIT:-100}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
